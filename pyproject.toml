[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-foundations-from-scratch"
version = "0.1.0"
description = "CPU-only builds of AI fundamentals from scratch: gradient descent, fitting, neural nets, embeddings, attention, a tiny transformer, diffusion, multimodal and an end-to-end agent stack"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["numpy==2.1.3", "matplotlib==3.9.2", "torch==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
aifound = "aifound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
